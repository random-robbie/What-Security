<header class="site-header">
  <div class="wrapper">
    <a href="{{ "/" | relative_url }}" class="logo-link">What-Security</a>
    <nav class="main-menu">
      <ul>
        <li {% if page.url == "/" %}class="active"{% endif %}><a href="{{ "/" | relative_url }}">Home</a></li>
        <li {% if page.url == "/cli/" %}class="active"{% endif %}><a href="{{ "/cli/" | relative_url }}">CLI Tips</a></li>
        <li {% if page.url == "/projects/" %}class="active"{% endif %}><a href="{{ "/projects/" | relative_url }}">Projects</a></li>
        <li {% if page.url == "/lab/" %}class="active"{% endif %}><a href="{{ "/lab/" | relative_url }}">Lab</a></li>
        <li {% if page.url == "/media/" %}class="active"{% endif %}><a href="{{ "/media/" | relative_url }}">Media</a></li>
        <li {% if page.url == "/howto/" %}class="active"{% endif %}><a href="{{ "/howto/" | relative_url }}">How to</a></li>
        <li {% if page.url == "/about/" %}class="active"{% endif %}><a href="{{ "/about/" | relative_url }}">About</a></li>
      </ul>
    </nav>
    <div class="theme-dots" title="Switch color theme">
      <button class="theme-dot active" data-theme="matrix" aria-label="Matrix theme"></button>
      <button class="theme-dot" data-theme="dracula" aria-label="Dracula theme"></button>
      <button class="theme-dot" data-theme="nord" aria-label="Nord theme"></button>
      <button class="theme-dot" data-theme="gruvbox" aria-label="Gruvbox theme"></button>
      <button class="theme-dot" data-theme="mono" aria-label="Mono theme"></button>
    </div>
  </div>
</header>
